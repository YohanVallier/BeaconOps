services:
  beaconops:
    build:
      context: .
      dockerfile: Dockerfile
    image: beaconops:0.1.0
    container_name: beaconops
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BEACONOPS_ENV: ${BEACONOPS_ENV:-production}
      BEACONOPS_LOG_LEVEL: ${BEACONOPS_LOG_LEVEL:-INFO}
      BEACONOPS_DATABASE_URL: ${BEACONOPS_DATABASE_URL:-sqlite:////data/beaconops.db}
      BEACONOPS_HOST: 0.0.0.0
      BEACONOPS_PORT: "8000"
      BEACONOPS_RELOAD: "false"
    ports:
      - "${BEACONOPS_PORT:-8000}:8000"
    volumes:
      - beaconops-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  beaconops-data:
    driver: local